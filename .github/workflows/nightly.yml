name: nightly profile refresh

# Redraws every card from public data and commits assets/, README.md and scripts/state.json when they changed.
# Nothing here needs a secret. The built-in GITHUB_TOKEN is only passed on to lift the REST rate limit.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/**"
      - "profile.json"

permissions:
  contents: write

concurrency:
  group: nightly-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # build.py exits non-zero when a source has not been fetched for more than 3 days (the cards are then drawn
      # from the saved copy). The step may fail without stopping the job, so the other fresh data is still
      # committed; the last step then turns the run red and GitHub emails the owner.
      - id: build
        run: python scripts/build.py
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md scripts/state.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: nightly profile refresh"
            git push
          fi
      - name: Fail the run when the build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "build.py failed: a source is stale or the contribution calendar could not be read"
          exit 1
